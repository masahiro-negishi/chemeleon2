# @package _global_
# VAE with MACE encoder and distance matrix decoder

defaults:
  - override /vae_module/encoder: precomputed_mace
  - override /vae_module/decoder: distance_matrix

trainer:
  max_epochs: 5000

data:
  mace_embeddings: true  # Enable MACE embeddings (automatically pre-computed)
  mace_precompute_params:
    model: "mh-1"            # MACE model name
    head: "omat_pbe"         # MACE head name (for multihead models)
    hidden_dim: 512          # Expected embedding dimension (for validation)
    device: "cuda"           # Compute device (optional, auto-detects if omitted)

vae_module:
  atom_type_predict: true

  loss_weights:
    atom_types: 1.0
    lengths: 1.0
    angles: 10.0
    frac_coords: 0.0           # Disabled (using distance instead)
    distance_regression: 1.0    # Distance regression loss (on pairs < threshold)
    distance_classifier: 1.0    # Classifier loss (predicting close/far pairs)
    kl: 0.0                    # Disabled for precomputed MACE (deterministic posterior)
    fa: 0.0                    # Disabled (redundant with distance loss)

logger:
  wandb:
    name: "vae_mace_distance"
    group: "${task_name}/${data.dataset_type}"
    tags: ["vae", "mace", "distance_matrix"]
